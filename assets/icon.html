<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      .icon {
        position: fixed; inset: 0;
        display: grid; place-items: center;
        background: radial-gradient(120% 120% at 18% 8%, #2ee0cb 0%, #12b6a6 38%, #0a8f84 78%, #07736b 100%);
      }
      .icon::before {
        content: "";
        position: absolute; inset: 0;
        background: radial-gradient(70% 50% at 50% 0%, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 70%);
      }
      .mark { position: relative; width: 56%; height: 56%; }
      .mark svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2.5vmin 4vmin rgba(3, 60, 56, 0.32)); }
    </style>
  </head>
  <body>
    <div class="icon">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- main droplet: the cleaning liquid, not an AI sparkle -->
          <path
            d="M12 2.4c3.6 4.45 5.9 7.45 5.9 10.2a5.9 5.9 0 0 1-11.8 0c0-2.75 2.3-5.75 5.9-10.2Z"
            fill="#ffffff"
          />
          <!-- highlight inside the drop: a wet reflection, not a facial feature -->
          <ellipse cx="9.8" cy="13.1" rx="1.15" ry="2.15" fill="#0a8f84" opacity=".32" transform="rotate(18 9.8 13.1)" />
          <!-- two bubbles: cleaning, relevant, and no sparkle anywhere -->
          <circle cx="18.4" cy="7.1" r="1.55" fill="#ffffff" opacity=".92" />
          <circle cx="20.6" cy="11.3" r=".95" fill="#ffffff" opacity=".7" />
        </svg>
      </div>
    </div>
  </body>
</html>
